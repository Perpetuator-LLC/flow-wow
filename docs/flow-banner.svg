<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Flow (unfettered): WoW levelling companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121c"/>
      <stop offset="1" stop-color="#1f2333"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E69F00"/>
      <stop offset="1" stop-color="#F0E442"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <!-- the route: checkpoints joined by a path (same colours as in game) -->
  <path d="M60 182 C 160 150, 230 205, 320 172 S 470 145, 560 165 S 720 200, 840 150"
        fill="none" stroke="#009E73" stroke-width="5" stroke-linecap="round"/>
  <path d="M320 172 C 380 210, 470 205, 560 165" fill="none" stroke="#F0E442" stroke-width="3"
        stroke-dasharray="8 8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="60" cy="182" r="11" fill="#E69F00"/>
  <circle cx="320" cy="172" r="10" fill="#009E73"/>
  <circle cx="560" cy="165" r="10" fill="#0072B2"/>
  <circle cx="840" cy="150" r="10" fill="#009E73"/>
  <text x="76" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#E69F00">1 [9]</text>
  <text x="576" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#56B4E9">!2 [8]</text>
  <text x="450" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" letter-spacing="18" fill="url(#gold)">FLOW</text>
  <text x="450" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" fill="#d8d8e0">(unfettered)  ·  World of Warcraft levelling companion</text>
</svg>
